model:
  name: "neural_baseline"
  family: "neural_network"
  type: "classifier"
  explainer_type: "kernel_shap"

hyperparameters:
  hidden_layer_sizes: [128, 64, 32]
  learning_rate_init: 0.001
  alpha: 0.0001
  batch_size: 256
  max_iter: 100
  random_state: 42

training:
  early_stopping_patience: 10
  device: "auto" # auto detects CUDA -> other accelerator -> CPU
