model:
  name: "fingpt"
  model_id: "FinGPT/fingpt-forecaster_dow30_llama2-7b_lora"
  fallback_model_id: "meta-llama/Llama-3.2-3B-Instruct"
  family: "finance_pretrained"

peft:
  method: "lora"
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"

training:
  learning_rate: 0.0002
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  max_seq_length: 1024
  warmup_ratio: 0.03
  weight_decay: 0.01
  logging_steps: 50
  eval_steps: 250
  save_steps: 250
  fp16: "auto"
  bf16: "auto"
  device: "auto"

evaluation:
  batch_size: 8
  max_new_tokens: 350
  temperature: 0.1
  top_p: 0.95
