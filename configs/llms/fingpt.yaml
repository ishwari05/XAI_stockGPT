model:
  name: "fingpt"
  model_id: "NousResearch/Llama-2-7b-hf"
  fallback_model_id: "Qwen/Qwen2.5-1.5B-Instruct"
  family: "finance_pretrained"

peft:
  method: "lora"
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"

training:
  learning_rate: 0.0001
  num_train_epochs: 1
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  max_seq_length: 1024
  warmup_ratio: 0.03
  weight_decay: 0.01
  max_grad_norm: 1.0
  logging_steps: 50
  eval_steps: 1000
  save_steps: 1000
  fp16: "auto"
  bf16: "auto"
  device: "auto"

evaluation:
  batch_size: 8
  max_new_tokens: 350
  temperature: 0.1
  top_p: 0.95
